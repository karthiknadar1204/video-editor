name: Test
on: [push, pull_request]
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: bun run typecheck
      - run: bun run test:timeline
      - run: bun test apps/runner/test
      - run: bun run test:migrations
      - name: Ensure FFmpeg and ffprobe are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .local/whisper-1.8.3/ggml-base.en.bin
            .local/whisper-1.8.3/source.tar.gz
          key: whisper-downloads-${{ hashFiles('apps/worker/whisper.ts') }}
      - run: bun run --cwd apps/worker setup:whisper
      - run: CUTROOM_TEST_WHISPER=1 bun test apps/worker/test
      - run: bunx playwright install --with-deps chromium
      - run: bun test packages/composition/test
      - run: bun run test
        env:
          E2E_PRODUCTION: "1"
          CUTROOM_TEST_WHISPER: "1"
          CUTROOM_MEDIA_STORAGE: local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/**/trace.zip
          retention-days: 3
          if-no-files-found: ignore
